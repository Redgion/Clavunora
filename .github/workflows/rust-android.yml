name: Clavunora Android preview
on:
  workflow_dispatch:
  push:
    branches: [codex/android-preview]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust Android toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android && rustup default 1.99.1
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-apk
            rust/target
          key: android-arm64-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: android-arm64-
      - name: Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_manager=$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | head -1)
          "$sdk_manager" "platforms;android-36" "build-tools;36.0.0"
          ndk_root=$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"
      - name: APK packager
        run: command -v cargo-apk || cargo install cargo-apk --version 0.10.0 --locked
      - name: Package corresponding source
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          python scripts/package_rust_source.py
          mkdir -p dist/android
          cp dist/*-source.tar.gz dist/android/Clavunora-Android-preview-source.tar.gz
      - name: Include license notices
        run: |
          mkdir -p pianoflow/resources/licenses/clavunora
          cp LICENSE COPYRIGHT THIRD_PARTY_NOTICES.md AI_USAGE.md pianoflow/resources/licenses/clavunora/
          cp -R packaging/rust-notices pianoflow/resources/licenses/clavunora/rust
          cp rust/crates/clavunora-app/assets/FONT-LICENSE.txt pianoflow/resources/licenses/clavunora/brand-font-LICENSE.txt
      - name: Include dependency licenses
        shell: python
        run: |
          import os, re, shutil
          from pathlib import Path
          registry = Path(os.environ.get('CARGO_HOME', str(Path.home() / '.cargo'))) / 'registry/src'
          for path in registry.rglob('*'):
              if path.is_file() and re.search(r'license|copying|notice|copyright', path.name, re.I):
                  target = Path('pianoflow/resources/licenses/clavunora/crates') / path.relative_to(registry)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
      - name: Build installable ARM64 test APK
        working-directory: rust/crates/clavunora-app
        env:
          RUSTFLAGS: --remap-path-prefix=/home/runner=~ -C link-arg=-Wl,-z,max-page-size=16384
        run: cargo apk build --lib --target aarch64-linux-android
      - name: Collect APK and verify signature
        run: |
          mkdir -p dist/android
          find rust/target -name '*.apk' -type f -exec cp {} dist/android/Clavunora-Android-arm64-preview.apk \;
          test -s dist/android/Clavunora-Android-arm64-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/android/Clavunora-Android-arm64-preview.apk
          cd dist/android && sha256sum *.apk *.tar.gz > SHA256SUMS.txt
      - name: Save native cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-apk
            rust/target
          key: android-arm64-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: Clavunora-Android-arm64-preview
          path: dist/android/
          if-no-files-found: error
