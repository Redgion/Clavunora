[package]
name = "clavunora-rust"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clavunora-core = { path = "../clavunora-core" }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow"] }
midir = "0.11"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

tempfile = "3"
libloading = "0.8"

image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"
eframe = { version = "0.34.3", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "=0.18.2"
rfd = { version = "=0.17.2", default-features = false }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
cpal = "=0.18.2"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["android-native-activity", "glow", "default_fonts"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = "0.21.1"
ndk-context = "0.1.1"
cpal = "=0.18.2"

[package.metadata.android]
package = "org.redgion.clavunora.preview"
label = "Clavunora Preview"
assets = "../../../pianoflow/resources"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 36

[package.metadata.android.application]
label = "Clavunora Preview"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density|uiMode"
